name: delete-release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to delete (release, assets and git tag)"
        required: true

jobs:
  delete-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ inputs.tag }}" --yes --cleanup-tag
